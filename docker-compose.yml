services:
  test-app:
    image: node:20-alpine
    container_name: test-todo-app
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - global-npm-cache:/root/.npm
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  global-npm-cache:
    name: global-npm-cache
