apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-deployment
  labels:
    app.kubernetes.io/name: test-app
    app.kubernetes.io/component: frontend
spec:
  # Desired replicas for high availability
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: test-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-app
    spec:
      # Security Hardening: Non-root container security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: test-app
          image: test-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http

          envFrom:
            - configMapRef:
                name: test-app-config

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          # Kubernetes Liveness Probe: Auto-restart dead pods
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Kubernetes Readiness Probe: Auto-remove unready pods from load balancer
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
