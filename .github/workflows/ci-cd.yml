name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      # Step 1: Compile TypeScript & bundle SPA assets
      - name: Compile & build application
        run: npm run build

      # Step 2: Validate environment variables
      - name: Validate environment config
        run: |
          export APP_ENV="test"
          [ -n "$APP_ENV" ] || exit 1

      # Step 3: Container smoke test
      - name: Build test Docker image
        run: docker build -f Dockerfile.prod -t test-app:test .

      - name: Execute container health check
        run: |
          docker run -d -p 8080:80 --name test-app-container test-app:test
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          docker stop test-app-container && docker rm test-app-container
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with HTTP status $STATUS"
            exit 1
          fi

      # Step 4: Verify compiled bundle output
      - name: Verify build artifacts
        run: test -f dist/index.html

  deploy:
    name: Build & Push Container Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-architecture support
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx engine
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'practice-user' }}
          password: ${{ secrets.DOCKER_PASSWORD || 'dummy-token' }}
        continue-on-error: true

      - name: Build and push multi-architecture image (amd64, arm64)
        run: |
          IMAGE_TAG="test-app:${{ github.sha }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.prod \
            -t "$IMAGE_TAG" \
            -t "test-app:latest" \
            --output type=image,push=false .
